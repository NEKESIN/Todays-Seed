ction>`;}).join('');}$('#fileTree').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(Date.now()<lastPlantDragAt)return;const d=readDrafts().find(x=>x.id===b.dataset.open);if(d)loadDraft(d);});$('#fileTree').querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{const d=readDrafts().find(x=>x.id===b.dataset.download);if(!d)return;const blob=new Blob([`# ${d.title}\n\n${d.body}`],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${d.title.replace(/[\\/:*?"<>|]/g,'_')}.md`;a.click();URL.revokeObjectURL(url);});$('#fileTree').querySelectorAll('[data-delete-shelf]').forEach(b=>{b.onclick=e=>{e.stopPropagation();requestShelfDelete(b.dataset.deleteShelf);};b.ondblclick=e=>e.stopPropagation();});$('#fileTree').querySelectorAll('[data-edit-shelf]').forEach(el=>el.ondblclick=()=>{const state=readCollectionLayout(readDrafts()),shelf=state.shelves.find(x=>x.id===el.dataset.editShelf);if(!shelf)return;const name=prompt('책장 이름 또는 카테고리를 입력하세요.',shelf.label);if(name===null||!name.trim())return;shelf.label=name.trim();localStorage.setItem('munjang-collection-layout',JSON.stringify(state));renderCollector();});$('#fileTree').querySelectorAll('.plant-card').forEach(card=>{card.addEventListener('contextmenu',e=>openPlantContextMenu(e,card.dataset.id));card.addEventListener('dragstart',e=>{draggedPlant=card;plantDragMoved=false;lastPlantDragAt=Date.now()+700;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.dataset.id);});card.addEventListener('dragend',()=>{card.classList.remove('dragging');draggedPlant=null;if(plantDragMoved){persistPlantPositions();renderCollector();}plantDragMoved=false;});card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{if(!draggedPlant)return;e.preventDefault();e.stopPropagation();const r=card.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;if(card!==draggedPlant){card.parentNode.insertBefore(draggedPlant,after?card.nextSibling:card);plantDragMoved=true;}});});$('#fileTree').querySelectorAll('.plant-shelf-grid').forEach(grid=>{grid.addEventListener('dragover',e=>{e.preventDefault();grid.classList.add('drop-ready');});grid.addEventListener('dragleave',e=>{if(!grid.contains(e.relatedTarget))grid.classList.remove('drop-ready');});grid.addEventListener('drop',e=>{if(!draggedPlant)return;e.preventDefault();grid.classList.remove('drop-ready');if(e.target===grid&&draggedPlant.parentElement!==grid){grid.appendChild(draggedPlant);plantDragMoved=true;}});});$('#filePanel')?.classList.toggle('arranging',isArrangingPlants);$('#arrangePlants').textContent=isArrangingPlants?'완료':'식물 위치 바꾸기';$('#arrangePlants').setAttribute('aria-pressed',String(isArrangingPlants));}
        $('#addShelf').onclick=()=>{const state=readCollectionLayout(readDrafts()),n=state.shelves.length+1;state.shelves.push({id:`shelf-${Date.now()}`,label:`새 책장 ${n}`,ids:[],custom:true});localStorage.setItem('munjang-collection-layout',JSON.stringify(state));renderCollector();};    $('#arrangePlants').onclick=()=>{if(!isArrangingPlants){isArrangingPlants=true;renderCollector();return;}const state=readCollectionLayout(readDrafts());state.shelves.forEach(s=>{const row=$(`#fileTree .plant-shelf-grid[data-shelf-id="${CSS.escape(s.id)}"]`);s.ids=row?[...row.querySelectorAll('.plant-card')].map(card=>card.dataset.id):[];});localStorage.setItem('munjang-collection-layout',JSON.stringify(state));isArrangingPlants=false;renderCollector();};    $('#newDoc').onclick=()=>{activeDraft=null;currentFavorite=false;syncSeedFavorite();$('#docTitle').value='';$('#docBody').value='';$('#docGenre').textContent=`${type==='web'?'웹소설':'소설'} · ${genre}`;$('#saveStatus').textContent='새 글';$('#seedPromptText').textContent=readSaved().length?`오늘의 씨앗　|　${readSaved().map(x=>x.word||x.words?.join(' · ')).join('　 ·　 ')}`:'씨앗 바구니에서 단어를 골라 이야기를 시작해 보세요.';updateCount();};
    function closeSettings(){$('#settingsPanel').hidden=true;$('#settingsToggle').setAttribute('aria-expanded','false');}
    $('#settingsToggle').onclick=()=>{const open=$('#settingsPanel').hidden;$('#settingsPanel').hidden=!open;$('#settingsToggle').setAttribute('aria-expanded',String(open));};
    document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setThemeChoice(b.dataset.themeChoice));
    function setThemeChoice(theme){if(theme==='moon'||theme==='winter')document.body.dataset.theme=theme;else document.body.removeAttribute('data-theme');localStorage.setItem('munjang-theme',theme);document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)));closeSettings();if(!$('#collectScreen').hidden)renderCollector();}
    document.addEventListener('click',e=>{if(!e.target.closest('.settings-wrap'))closeSettings();});
    const initialTheme=localStorage.getItem('munjang-theme')||'default';if(initialTheme==='moon'||initialTheme==='winter')document.body.dataset.theme=initialTheme;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===initialTheme)));
    const syncBasketHeight=()=>document.documentElement.style.setProperty('--basket-height',`${$('.picker').getBoundingClientRect().height}px`);if('ResizeObserver'in window)new ResizeObserver(syncBasketHeight).observe($('.picker'));window.addEventListener('resize',syncBasketHeight);syncBasketHeight();renderGenres();renderSaved();
  </script>
